name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast tests
        run: python -m pytest tests/ -v --tb=short -m "not slow"

      - name: Paper metric regression (slow)
        run: python -m pytest tests/test_paper_metrics.py -v --tb=short

      - name: Smoke-test figure generation imports
        run: |
          python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              'gen_figures',
              'paper/sic_gp_quality/gen_figures.py',
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, 'load')
          print('[OK] gen_figures imports')
          "