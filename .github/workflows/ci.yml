name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: sudo apt-get install -y cppcheck clang-tidy

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pybind11 numpy scipy scikit-learn pytest

      - name: Static analysis — cppcheck
        run: |
          cppcheck --enable=warning,style,performance \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=1 \
                   --std=c++14 \
                   fem/ ml/ pipeline/ machine/ vision/ embedded/ comms/ \
                   --quiet

      - name: Static analysis — clang-tidy (non-blocking)
        run: |
          PY_INC="$(python -m pybind11 --includes)"
          find vision embedded comms fem/\_spindle_kernel.cpp ml/\_enkf_kernel.cpp \
               -name "*.cpp" | head -8 | xargs -I{} \
          clang-tidy {} -- -std=c++14 ${PY_INC} 2>&1 | tee /tmp/clang_tidy.log || true
          echo "clang-tidy warnings above (non-blocking)"

      - name: Build C++ kernels
        run: bash build_all_kernels.sh all
        # CUDA kernel silently skipped (no nvcc on GitHub Actions runners)

      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short