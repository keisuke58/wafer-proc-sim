name: Physics Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install numpy scipy scikit-learn matplotlib joblib pandas pytest

      - name: Run physics unit tests
        run: python -m pytest tests/ -v --tb=short
