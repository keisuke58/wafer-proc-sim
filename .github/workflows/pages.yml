name: Deploy dashboard to GitHub Pages

# Publishes the self-contained wproc dashboards to GitHub Pages.
# Repo setting: Settings -> Pages -> Source = "GitHub Actions".
# Runs on the default branch and the feature branch, plus manual dispatch.
on:
  push:
    branches: [master, main, claude/new-session-oknyyz]
    paths:
      - "vision/cpp/docs/**"
      - ".github/workflows/pages.yml"
      # Gallery figures are pulled from these dirs, so publish when they change.
      - "results/**"
      - "notebooks/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp vision/cpp/docs/landing.html         _site/index.html
          cp vision/cpp/docs/wproc_dashboard.html _site/dashboard.html
          cp vision/cpp/docs/kerf_annotated.html  _site/kerf_annotated.html
          cp vision/cpp/docs/grind_dashboard.html _site/grind.html
          cp vision/cpp/docs/grind_explained.html _site/grind_explained.html
          cp vision/cpp/docs/laser_dashboard.html _site/laser.html
          cp vision/cpp/docs/laser_explained.html _site/laser_explained.html
          cp vision/cpp/docs/smart_dashboard.html _site/smart.html
          cp vision/cpp/docs/smart_explained.html _site/smart_explained.html
          cp vision/cpp/docs/systems_dashboard.html _site/systems.html
          cp vision/cpp/docs/systems_explained.html _site/systems_explained.html
          cp vision/cpp/docs/metro_dashboard.html  _site/metro.html
          cp vision/cpp/docs/metro_explained.html  _site/metro_explained.html
          cp vision/cpp/docs/optomech.html         _site/optomech.html
          cp vision/cpp/docs/inspection.html       _site/inspection.html
          cp vision/cpp/docs/keyence.html          _site/keyence.html
          cp vision/cpp/docs/screen.html           _site/screen.html
          cp vision/cpp/docs/advantest.html        _site/advantest.html
          cp vision/cpp/docs/kioxia.html           _site/kioxia.html
          cp vision/cpp/docs/tel.html              _site/tel.html
          cp vision/cpp/docs/companies.html        _site/companies.html
          cp vision/cpp/docs/accretech.html        _site/accretech.html
          # Figures generated by the C++ demo tools (and the defect-CNN trainer).
          cp vision/cpp/docs/assets/grind_thickness.png _site/assets/ || echo "missing grind_thickness"
          cp vision/cpp/docs/assets/grind_ssd.png       _site/assets/ || echo "missing grind_ssd"
          cp vision/cpp/docs/assets/laser_groove.png    _site/assets/ || echo "missing laser_groove"
          cp vision/cpp/docs/assets/laser_sd.png        _site/assets/ || echo "missing laser_sd"
          cp vision/cpp/docs/assets/smart_align.png     _site/assets/ || echo "missing smart_align"
          cp vision/cpp/docs/assets/defect_cnn_samples.png _site/assets/ || echo "missing defect_cnn_samples"
          cp vision/cpp/docs/assets/pkg_bumps.png       _site/assets/ || echo "missing pkg_bumps"
          cp vision/cpp/docs/assets/adc_wafermap.png    _site/assets/ || echo "missing adc_wafermap"
          cp vision/cpp/docs/assets/vcal_residuals.png  _site/assets/ || echo "missing vcal_residuals"
          cp vision/cpp/docs/assets/regi_diff.png       _site/assets/ || echo "missing regi_diff"
          cp vision/cpp/docs/assets/route_path.png      _site/assets/ || echo "missing route_path"
          cp vision/cpp/docs/assets/tol_hist.png        _site/assets/ || echo "missing tol_hist"
          cp vision/cpp/docs/assets/cam_step.png        _site/assets/ || echo "missing cam_step"
          cp vision/cpp/docs/assets/ois_trace.png       _site/assets/ || echo "missing ois_trace"
          cp vision/cpp/docs/assets/barrel_modes.png    _site/assets/ || echo "missing barrel_modes"
          cp vision/cpp/docs/assets/barrel_thermal.png  _site/assets/ || echo "missing barrel_thermal"
          cp vision/cpp/docs/assets/barrel_shock.png    _site/assets/ || echo "missing barrel_shock"
          cp vision/cpp/docs/assets/gnn_parity.png      _site/assets/ || echo "missing gnn_parity"
          cp vision/cpp/docs/assets/generative_convergence.png _site/assets/ || echo "missing gen_conv"
          cp vision/cpp/docs/assets/design_pareto.png   _site/assets/ || echo "missing design_pareto"
          cp vision/cpp/docs/assets/axisym_mesh.png     _site/assets/ || echo "missing axisym_mesh"
          cp vision/cpp/docs/assets/mtf_curves.png      _site/assets/ || echo "missing mtf_curves"
          cp vision/cpp/docs/assets/mtf_tolerance.png   _site/assets/ || echo "missing mtf_tolerance"
          cp vision/cpp/docs/assets/ois_bode.png        _site/assets/ || echo "missing ois_bode"
          cp vision/cpp/docs/assets/ois_rejection.png   _site/assets/ || echo "missing ois_rejection"
          cp vision/cpp/docs/assets/notch_bode.png      _site/assets/ || echo "missing notch_bode"
          cp vision/cpp/docs/assets/barrel_3d.png       _site/assets/ || echo "missing barrel_3d"
          cp vision/cpp/docs/assets/insp_scene.png      _site/assets/ || echo "missing insp_scene"
          cp vision/cpp/docs/assets/insp_detect.png     _site/assets/ || echo "missing insp_detect"
          cp vision/cpp/docs/assets/insp_phase.png      _site/assets/ || echo "missing insp_phase"
          cp vision/cpp/docs/assets/insp_curve.png      _site/assets/ || echo "missing insp_curve"
          cp vision/cpp/docs/assets/real_gallery.png    _site/assets/ || echo "missing real_gallery"
          cp vision/cpp/docs/assets/real_auroc.png      _site/assets/ || echo "missing real_auroc"
          cp vision/cpp/docs/assets/neu_real_classifier.png _site/assets/ || echo "missing neu_real_classifier"
          cp vision/cpp/docs/assets/barrel_gdt.png      _site/assets/ || echo "missing barrel_gdt"
          cp vision/cpp/docs/assets/lj_chain.png        _site/assets/ || echo "missing lj_chain"
          cp vision/cpp/docs/assets/lj_bench.png        _site/assets/ || echo "missing lj_bench"
          cp vision/cpp/docs/assets/lj_profile.png      _site/assets/ || echo "missing lj_profile"
          cp vision/cpp/docs/assets/lj_capability.png   _site/assets/ || echo "missing lj_capability"
          cp vision/cpp/docs/assets/ps_lockin.png       _site/assets/ || echo "missing ps_lockin"
          cp vision/cpp/docs/assets/md_galvo.png        _site/assets/ || echo "missing md_galvo"
          cp vision/cpp/docs/assets/vhx_stack.png       _site/assets/ || echo "missing vhx_stack"
          cp vision/cpp/docs/assets/dress_state.png     _site/assets/ || echo "missing dress_state"
          cp vision/cpp/docs/assets/dress_policy.png    _site/assets/ || echo "missing dress_policy"
          cp vision/cpp/docs/assets/stop_chain.png      _site/assets/ || echo "missing stop_chain"
          cp vision/cpp/docs/assets/sensor_ptc.png      _site/assets/ || echo "missing sensor_ptc"
          cp vision/cpp/docs/assets/sensor_hdr.png      _site/assets/ || echo "missing sensor_hdr"
          cp vision/cpp/docs/assets/af_hybrid.png       _site/assets/ || echo "missing af_hybrid"
          cp vision/cpp/docs/assets/im_scene.png        _site/assets/ || echo "missing im_scene"
          cp vision/cpp/docs/assets/im_repeat.png       _site/assets/ || echo "missing im_repeat"
          cp vision/cpp/docs/assets/ae_anomaly.png      _site/assets/ || echo "missing ae_anomaly"
          cp vision/cpp/docs/assets/adc_al.png          _site/assets/ || echo "missing adc_al"
          cp vision/cpp/docs/assets/euv_print.png       _site/assets/ || echo "missing euv_print"
          cp vision/cpp/docs/assets/photon_budget.png   _site/assets/ || echo "missing photon_budget"
          cp vision/cpp/docs/assets/clean_pre.png       _site/assets/ || echo "missing clean_pre"
          cp vision/cpp/docs/assets/clean_chem.png      _site/assets/ || echo "missing clean_chem"
          cp vision/cpp/docs/assets/clean_spin.png      _site/assets/ || echo "missing clean_spin"
          cp vision/cpp/docs/assets/clean_dicing.png    _site/assets/ || echo "missing clean_dicing"
          cp vision/cpp/docs/assets/spray_dry.png       _site/assets/ || echo "missing spray_dry"
          cp vision/cpp/docs/assets/ate_eye.png         _site/assets/ || echo "missing ate_eye"
          cp vision/cpp/docs/assets/ate_shmoo.png       _site/assets/ || echo "missing ate_shmoo"
          cp vision/cpp/docs/assets/nand_vth.png        _site/assets/ || echo "missing nand_vth"
          cp vision/cpp/docs/assets/nand_life.png       _site/assets/ || echo "missing nand_life"
          cp vision/cpp/docs/assets/tel_etch.png        _site/assets/ || echo "missing tel_etch"
          cp vision/cpp/docs/assets/tel_ald.png         _site/assets/ || echo "missing tel_ald"
          cp vision/cpp/docs/assets/acc_rough.png       _site/assets/ || echo "missing acc_rough"
          cp vision/cpp/docs/assets/acc_round.png       _site/assets/ || echo "missing acc_round"
          # Curated result figures for the gallery on the landing page.
          for f in \
            notebooks/vision_single_kerf.png notebooks/vision_accuracy.png \
            results/cfrp_defect_detection.png results/cfrp_ndt_delamination.png \
            results/cfrp_cutting_model.png \
            results/fno_stress_fields.png results/deeponet_field_comparison.png \
            results/fem_exp_comparison.png results/crystal_anisotropy.png \
            results/die_strength_analysis.png \
            results/disco_blade_wear_gp.png results/disco_blade_wear_realdata.png \
            results/blade_wear.png results/disco_chip_volume.png \
            results/active_learning_ei.png results/gp_experimental_heatmap.png \
            results/disect_tmcmc_calibration.png results/ekf_state_estimation.png \
            results/cost_per_die.png results/gp_multifidelity.png; do
            [ -f "$f" ] && cp "$f" _site/assets/ || echo "missing: $f"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The Pages backend intermittently returns "Deployment failed, try again
      # later." even though the artifact uploaded fine. Retry with backoff so a
      # transient hiccup doesn't require a manual re-run (an immediate retry hits
      # the same backend state, so wait between attempts).
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
