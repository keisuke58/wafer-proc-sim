name: Deploy dashboard to GitHub Pages

# Publishes the self-contained wproc dashboards to GitHub Pages.
# Repo setting: Settings -> Pages -> Source = "GitHub Actions".
# Runs on the default branch and the feature branch, plus manual dispatch.
on:
  push:
    branches: [master, main, claude/new-session-oknyyz]
    paths:
      - "vision/cpp/docs/**"
      - ".github/workflows/pages.yml"
      # Gallery figures are pulled from these dirs, so publish when they change.
      - "results/**"
      - "notebooks/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp vision/cpp/docs/landing.html         _site/index.html
          cp vision/cpp/docs/wproc_dashboard.html _site/dashboard.html
          cp vision/cpp/docs/kerf_annotated.html  _site/kerf_annotated.html
          cp vision/cpp/docs/grind_dashboard.html _site/grind.html
          cp vision/cpp/docs/grind_explained.html _site/grind_explained.html
          cp vision/cpp/docs/laser_dashboard.html _site/laser.html
          cp vision/cpp/docs/laser_explained.html _site/laser_explained.html
          cp vision/cpp/docs/smart_dashboard.html _site/smart.html
          cp vision/cpp/docs/smart_explained.html _site/smart_explained.html
          cp vision/cpp/docs/systems_dashboard.html _site/systems.html
          cp vision/cpp/docs/systems_explained.html _site/systems_explained.html
          # Figures generated by the C++ demo tools (and the defect-CNN trainer).
          cp vision/cpp/docs/assets/grind_thickness.png _site/assets/ || echo "missing grind_thickness"
          cp vision/cpp/docs/assets/grind_ssd.png       _site/assets/ || echo "missing grind_ssd"
          cp vision/cpp/docs/assets/laser_groove.png    _site/assets/ || echo "missing laser_groove"
          cp vision/cpp/docs/assets/laser_sd.png        _site/assets/ || echo "missing laser_sd"
          cp vision/cpp/docs/assets/smart_align.png     _site/assets/ || echo "missing smart_align"
          cp vision/cpp/docs/assets/defect_cnn_samples.png _site/assets/ || echo "missing defect_cnn_samples"
          cp vision/cpp/docs/assets/pkg_bumps.png       _site/assets/ || echo "missing pkg_bumps"
          cp vision/cpp/docs/assets/adc_wafermap.png    _site/assets/ || echo "missing adc_wafermap"
          # Curated result figures for the gallery on the landing page.
          for f in \
            notebooks/vision_single_kerf.png notebooks/vision_accuracy.png \
            results/cfrp_defect_detection.png results/cfrp_ndt_delamination.png \
            results/cfrp_cutting_model.png \
            results/fno_stress_fields.png results/deeponet_field_comparison.png \
            results/fem_exp_comparison.png results/crystal_anisotropy.png \
            results/die_strength_analysis.png \
            results/disco_blade_wear_gp.png results/disco_blade_wear_realdata.png \
            results/blade_wear.png results/disco_chip_volume.png \
            results/active_learning_ei.png results/gp_experimental_heatmap.png \
            results/disect_tmcmc_calibration.png results/ekf_state_estimation.png \
            results/cost_per_die.png results/gp_multifidelity.png; do
            [ -f "$f" ] && cp "$f" _site/assets/ || echo "missing: $f"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The Pages backend intermittently returns "Deployment failed, try again
      # later." even though the artifact uploaded fine. Retry with backoff so a
      # transient hiccup doesn't require a manual re-run (an immediate retry hits
      # the same backend state, so wait between attempts).
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
