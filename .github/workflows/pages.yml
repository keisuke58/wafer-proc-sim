name: Deploy dashboard to GitHub Pages

# Publishes the self-contained wproc dashboards to a `gh-pages` branch.
# Enable Pages once under Settings -> Pages -> Source: "Deploy from a branch"
# -> branch `gh-pages` / root. Thereafter every push updates the site.
on:
  push:
    branches: [master, main, claude/new-session-oknyyz]
    paths:
      - "vision/cpp/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rm -rf site && mkdir -p site
          cp vision/cpp/docs/wproc_dashboard.html site/index.html
          cp vision/cpp/docs/kerf_annotated.html  site/kerf_annotated.html
          touch site/.nojekyll   # serve files as-is, skip Jekyll

      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy dashboard from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
