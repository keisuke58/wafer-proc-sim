name: Deploy dashboard to GitHub Pages

# Publishes the self-contained wproc dashboards to GitHub Pages.
# Runs on the default branch and on the feature branch (for an immediate
# preview), plus manual dispatch.
on:
  push:
    branches: [master, main, claude/new-session-oknyyz]
    paths:
      - "vision/cpp/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # The results dashboard is the landing page.
          cp vision/cpp/docs/wproc_dashboard.html _site/index.html
          cp vision/cpp/docs/kerf_annotated.html  _site/kerf_annotated.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
