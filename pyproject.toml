[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-proc-sim"
version = "0.1.0"
description = "Physics-informed surrogate modeling for 4H-SiC blade dicing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Keisuke Nishioka", email = "kei128608@gmail.com" }]
keywords = ["sic", "dicing", "gaussian-process", "semiconductor", "surrogate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
full = [
    "plotly>=5.20",
    "streamlit>=1.46.1",
    "yfinance>=0.2.40",
    "pennylane>=0.36.0",
]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/keisuke58/wafer-proc-sim"
Repository = "https://github.com/keisuke58/wafer-proc-sim"

[tool.setuptools.packages.find]
where = ["."]
include = ["validation*", "ml*", "pipeline*", "optimization*", "fem*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]